  <div class="box">

<div id="app">
  <header id="top">
    <div class="brand" title="New A OS · V3">
      <div class="mark"><svg style="color:var(--cyan)"><use href="#i-logo"/></svg></div>
      <h1><span class="px">NEW A</span><span class="os">OS</span><small>V3 · 2013 → PRESENT</small></h1>
    </div>
    <button class="scope-btn" id="scope-btn" title="Choose what New A OS is looking at (G)" aria-haspopup="true" aria-expanded="false"><i class="sw"></i><span class="crumbs" id="scope-crumbs"></span><b id="scope-name">New A City</b><svg><use href="#i-chev"/></svg></button>
    <div class="scope-sum" id="rail-end"></div>
    <div class="search" role="search">
      <svg><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search anything — buildings, numbers, streets, businesses, stations, places…" autocomplete="off" spellcheck="false" aria-label="Search the registry" aria-autocomplete="list" aria-controls="palette">
      <kbd>/</kbd>
      <div id="palette" class="palette" role="listbox" hidden></div>
    </div>
    <div class="top-actions">
      <div class="savestate" id="savestate" data-state="idle" title="Autosave state"><span class="dot"></span><span id="savetext">READY</span></div>
      <button class="btn icon" id="btn-news" title="Inbox — proposals from news, markets, the world scanner and Clawson"><svg><use href="#i-news"/></svg><span class="badge" id="news-badge" hidden></span></button>
      <button class="btn" id="btn-data" title="Vault, backups & settings"><svg><use href="#i-db"/></svg><span>Vault</span></button>
      <div class="addwrap"><button class="btn primary" id="btn-new" title="Add a building (N)"><svg><use href="#i-plus"/></svg><span>Add</span><svg class="chev"><use href="#i-chev"/></svg></button>
        <div class="addmenu" id="addmenu" hidden>
          <button data-add="building"><svg><use href="#i-bldg"/></svg>Building <kbd>N</kbd></button>
          <button data-add="historical"><svg><use href="#i-hist"/></svg>Demolished building <kbd>⇧N</kbd></button>
          <button data-add="business"><svg><use href="#i-biz"/></svg>Business</button>
          <button data-add="road"><svg><use href="#i-road"/></svg>Road — draw on the map</button>
          <button data-add="line"><svg><use href="#i-transit"/></svg>Transit line — draw on the map</button>
          <button data-add="station"><svg><use href="#i-station"/></svg>Station — place on the map</button>
          <button data-add="district"><svg><use href="#i-pin"/></svg>Borough / district</button>
          <button data-add="region"><svg><use href="#i-globe"/></svg>State / city / region</button>
          <button data-add="chronicle"><svg><use href="#i-img"/></svg>Chronicle image</button>
        </div></div>
    </div>
  </header>
  <div id="scope-pop" class="scope-pop" hidden></div>

  <nav id="side" aria-label="Sections">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="side-end" id="side-end"></div>
  </nav>

  <main id="main" tabindex="-1"></main>

  <footer id="status">
    <span class="sys">SYS</span>
    <span class="it"><i id="st-idb" class="off"></i><span id="st-idb-t">browser store</span></span>
    <span class="it"><i id="st-vault" class="off"></i><span id="st-vault-t">vault not linked</span></span>
    <span class="it"><i id="st-os" class="off"></i><span id="st-os-t">OS bridge · offline</span></span>
    <span class="it" id="st-counts">—</span>
    <span class="end">
      <button id="st-issues" title="Data-quality issues">◆ issues</button>
      <button id="st-keys" title="Keyboard shortcuts (?)">⌨ shortcuts</button>
      <span class="clock" id="clock">00:00:00</span>
    </span>
  </footer>
</div>
